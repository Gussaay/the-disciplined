# Device log review: the app's "Send log to Claude" opens an issue titled
# "[device-log] …". Claude (with the owner's Claude subscription token) reads
# the log against the code and answers on the issue. Without that token,
# Gemini answers if GEMINI_API_KEY is set. Only the repository owner's issues
# are read.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (uses the Claude Pro/Max plan)
#   GEMINI_API_KEY           optional fallback (aistudio.google.com)
name: Device log review

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

jobs:
  review:
    if: >-
      startsWith(github.event.issue.title, '[device-log]') &&
      (github.event_name == 'issues' || contains(github.event.comment.body, '@claude')) &&
      (github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Claude reads the log
        if: env.HAS_CLAUDE == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue comment:*)"'
          prompt: |
            Issue #${{ github.event.issue.number }} in ${{ github.repository }} holds a device
            connection log from The Disciplined app (lines: "→" sent, "←" received, "·" app notes).
            Read it with `gh issue view ${{ github.event.issue.number }} --comments`.
            For a watch log, compare it with src/lib/ls02.js, src/lib/watch.js and src/lib/watchLive.js
            (protocol notes: README "Smartwatch"). For a scale log, use src/lib/scaleParse.js.
            Answer with ONE comment via `gh issue comment`, in plain English, short:
            1) what the device answered and what it ignored, 2) what the app read or misread,
            3) the exact code change you suggest (file, function, bytes). Do not change files.

      - name: Gemini reads the log
        if: env.HAS_CLAUDE != 'true' && env.HAS_GEMINI == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue view "$NUM" --comments > issue.txt
          {
            echo "A device connection log from The Disciplined app follows (→ sent, ← received, · app notes),"
            echo "then the code that speaks to the device. Say briefly what the device answered or ignored,"
            echo "what the app misread, and the exact code change to make."
            echo "=== LOG ==="; cat issue.txt
            echo "=== src/lib/ls02.js ==="; cat src/lib/ls02.js
            echo "=== src/lib/watch.js ==="; cat src/lib/watch.js
          } > prompt.txt
          jq -n --rawfile t prompt.txt '{contents:[{parts:[{text:$t}]}]}' > req.json
          curl -sS -H 'Content-Type: application/json' -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d @req.json "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent" > res.json
          jq -r '.candidates[0].content.parts[0].text // ("Gemini error: " + (.error.message // "no answer"))' res.json > answer.md
          printf '\n\n_Gemini review_' >> answer.md
          gh issue comment "$NUM" --body-file answer.md

      - name: No reviewer key
        if: env.HAS_CLAUDE != 'true' && env.HAS_GEMINI != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "Log received. Add the CLAUDE_CODE_OAUTH_TOKEN (or GEMINI_API_KEY) secret for an automatic review; Claude in the project chat can read this issue meanwhile."
