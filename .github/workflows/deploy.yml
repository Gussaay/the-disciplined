name: Test, build web and APK

# Same flow as the Easy Pedia app. Every push:
#   1. runs the unit tests and builds the web app,
#   2. builds the Android APK and keeps it as a downloadable artifact.
# On main it also:
#   3. publishes the APK as a GitHub Release (permanent link):
#        https://github.com/Gussaay/the-disciplined/releases/latest/download/the-disciplined.apk
#   4. publishes the web app to GitHub Pages (needs Settings > Pages > Source:
#      "GitHub Actions" once; until then that job is skipped over),
#   5. deploys Firebase Hosting and the database rules (project disciplined-3e309)
#      when the FIREBASE_SERVICE_ACCOUNT_DISCIPLINED (or FIREBASE_SERVICE_ACCOUNT) secret exists (see README).
on:
  push:
    branches:
      - main
      - claude/project-thread-jj1y1l
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: the-disciplined.apk
  # Optional Firebase web config (repository variables). Empty = the app keeps
  # everything on the device and shows no sign-in.
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  # Google sign-in inside the Android app (the OAuth web client id, see README).
  VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}

jobs:
  web:
    name: Test and build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist
          retention-days: 14

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: web
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup Java 21 (required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      # Version = <major>.<minor> from package.json + the run number, e.g. 1.0.12.
      - name: Set app version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      # The fingerprint of the native side, built into the web code so an
      # over-the-air bundle is only installed on a matching APK.
      - name: Build web assets and sync Android
        run: |
          export VITE_NATIVE_HASH=$(node scripts/native-hash.mjs)
          echo "Native hash: $VITE_NATIVE_HASH"
          npm run build
          npx cap sync android

      # A plugin that is in npm but missing from the Android project builds
      # fine and then fails only when the feature is used.
      - name: Check the native plugins really synced
        run: |
          for plugin in capacitor-local-notifications capacitor-community-bluetooth-le capgo-capacitor-health capgo-capacitor-social-login capgo-capacitor-updater; do
            grep -qi "$plugin" android/capacitor.settings.gradle \
              || { echo "::error::$plugin is missing from the Android project"; exit 1; }
          done

      - name: Set versionCode / versionName
        run: |
          sed -i -e "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.version_code }}/" android/app/build.gradle
          sed -i -e "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # With the keystore secrets the APK is signed with your own key, so
      # every new build installs over the previous one.
      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          # KEY_ALIAS is optional: with one key in the keystore it is found here.
          ALIAS="$KEY_ALIAS"
          if [ -z "$ALIAS" ]; then
            ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | sed -n 's/^\([^,]*\),.*PrivateKeyEntry.*/\1/p' | head -1)
          fi
          [ -n "$ALIAS" ] || { echo "::error::No key alias found. Add the KEY_ALIAS secret."; exit 1; }
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          cp app/build/outputs/apk/release/app-release.apk "../$APK_NAME"
          rm -f "$RUNNER_TEMP/release.keystore"

      # Until the keystore secrets exist: a debug build. It installs and works
      # the same, but its key is made fresh on every run, so Android asks you
      # to uninstall the old build before installing a newer one (export a
      # backup in Settings first).
      - name: Build debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish the APK as a GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: The Disciplined ${{ steps.version.outputs.version }}
          body: Android app, version ${{ steps.version.outputs.version }}. Download the APK below and open it on your phone.
          files: ${{ env.APK_NAME }}
          make_latest: true

  pages:
    name: Publish web to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: web
    # Fails harmlessly until Pages is switched on in the repository settings.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build for the /the-disciplined/ path
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build
          # Deep links (e.g. /prayer) are answered by the app itself.
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  firebase:
    name: Deploy to Firebase Hosting (web + app updates)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Waits for the APK release, so native-version.json never points at an
    # APK that does not exist yet.
    needs: [web, android]
    env:
      HAS_FIREBASE: ${{ (secrets.FIREBASE_SERVICE_ACCOUNT_DISCIPLINED || secrets.FIREBASE_SERVICE_ACCOUNT) != '' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'disciplined-3e309' }}
      SITE_URL: ${{ vars.UPDATE_SITE || 'https://disciplined-3e309.web.app' }}
      VERSION: ${{ needs.android.outputs.version }}
      VERSION_CODE: ${{ needs.android.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_FIREBASE == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_FIREBASE == 'true'
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build the web app with the APK's version
        if: env.HAS_FIREBASE == 'true'
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm ci
          export VITE_NATIVE_HASH=$(node scripts/native-hash.mjs)
          echo "NATIVE_HASH=$VITE_NATIVE_HASH" >> "$GITHUB_ENV"
          npm run build
      # The over-the-air bundle: the built app, zipped. Installed apps with the
      # same native fingerprint download it and switch to it on their next
      # start. Zipped before anything else is added to dist/.
      - name: Create the over-the-air bundle and the version files
        if: env.HAS_FIREBASE == 'true'
        run: |
          ZIP="bundle-${VERSION}.zip"
          (cd dist && zip -qr "../${ZIP}" .)
          CHECKSUM=$(sha256sum "${ZIP}" | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%s | sed 's/\\/\\\\/g; s/"/\\"/g')
          mkdir -p dist/latest
          mv "${ZIP}" dist/latest/
          cat > dist/latest/update.json <<EOF
          {
            "version": "${VERSION}",
            "url": "${SITE_URL}/latest/${ZIP}",
            "checksum": "${CHECKSUM}",
            "nativeHash": "${NATIVE_HASH}",
            "notes": "${NOTES}"
          }
          EOF
          cat > dist/native-version.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${{ env.APK_NAME }}",
            "nativeHash": "${NATIVE_HASH}",
            "notes": "${NOTES}"
          }
          EOF
          cat dist/latest/update.json dist/native-version.json
      - name: Deploy hosting and database rules
        if: env.HAS_FIREBASE == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISCIPLINED || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm i -g firebase-tools@14
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only hosting,database --project "$FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Not set up
        if: env.HAS_FIREBASE != 'true'
        run: echo "Firebase is not configured (no FIREBASE_SERVICE_ACCOUNT secret). Skipped."

  functions:
    name: Deploy the AI function
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: web
    # Cloud Functions need the Blaze (pay as you go) plan. Until then this job
    # fails without stopping anything else; the app uses keys typed in Settings.
    continue-on-error: true
    env:
      HAS_FIREBASE: ${{ (secrets.FIREBASE_SERVICE_ACCOUNT_DISCIPLINED || secrets.FIREBASE_SERVICE_ACCOUNT) != '' }}
      HAS_KEY: ${{ (secrets.GEMINI_API_KEY || secrets.GROQ_API_KEY) != '' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'disciplined-3e309' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_FIREBASE == 'true' && env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_FIREBASE == 'true' && env.HAS_KEY == 'true'
        with:
          node-version: '22'
      - name: Store the keys and deploy
        if: env.HAS_FIREBASE == 'true' && env.HAS_KEY == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISCIPLINED || secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          (cd functions && npm install --no-audit --no-fund)
          npm i -g firebase-tools@14 --silent
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # A secret cannot be empty; "none" tells the function the key is absent.
          printf '%s' "${GEMINI_API_KEY:-none}" > "$RUNNER_TEMP/gemini"
          printf '%s' "${GROQ_API_KEY:-none}" > "$RUNNER_TEMP/groq"
          firebase functions:secrets:set GEMINI_API_KEY --data-file "$RUNNER_TEMP/gemini" --project "$FIREBASE_PROJECT_ID" --non-interactive --force
          firebase functions:secrets:set GROQ_API_KEY --data-file "$RUNNER_TEMP/groq" --project "$FIREBASE_PROJECT_ID" --non-interactive --force
          rm -f "$RUNNER_TEMP/gemini" "$RUNNER_TEMP/groq"
          firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Not set up
        if: env.HAS_FIREBASE != 'true' || env.HAS_KEY != 'true'
        run: echo "No GEMINI_API_KEY or GROQ_API_KEY repository secret. The AI function was not deployed."
